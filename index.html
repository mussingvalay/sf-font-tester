
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>San Francisco Font Tester</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 24px 16px 40px;
    background: #f5f5f7;
    color: #1d1d1f;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

header {
    max-width: 900px;
    margin: 0 auto 30px;
}

h1 {
    margin: 0;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -1.2px;
}

.subtitle {
    margin-top: 7px;
    color: #86868b;
    font-size: 15px;
}

main {
    max-width: 900px;
    margin: auto;
}

.section {
    background: #fff;
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 18px;
    overflow: hidden;
}

.section-title {
    margin: 0 0 18px;
    font-size: 23px;
    font-weight: 650;
    letter-spacing: -0.6px;
}

.sample {
    display: flex;
    align-items: baseline;
    gap: 16px;
    padding: 12px 0;
    border-top: 1px solid #f0f0f2;
}

.weight-label {
    flex: 0 0 105px;
    color: #86868b;
    font-size: 12px;
    font-weight: 500;
}

.sample-text {
    min-width: 0;
    font-size: 21px;
    line-height: 1.35;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-synthesis: none;
}

.w100 { font-weight: 100; }
.w200 { font-weight: 200; }
.w300 { font-weight: 300; }
.w400 { font-weight: 400; }
.w500 { font-weight: 500; }
.w600 { font-weight: 600; }
.w700 { font-weight: 700; }
.w800 { font-weight: 800; }
.w900 { font-weight: 900; }

.variable {
    font-variation-settings:
        "wght" var(--wght),
        "wdth" var(--wdth);
}

.width-47 { --wdth: 47; }
.width-60 { --wdth: 60; }
.width-100 { --wdth: 100; }
.width-132 { --wdth: 132; }

@media (max-width: 500px) {
    body {
        padding: 20px 12px 30px;
    }

    .section {
        padding: 18px;
    }

    .weight-label {
        flex-basis: 85px;
    }

    .sample-text {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<header>
    <h1>San Francisco</h1>
    <div class="subtitle">All weights × all widths</div>
</header>

<main id="tester"></main>

<script>
const weights = [
    ["Ultralight", 100],
    ["Thin", 200],
    ["Light", 300],
    ["Regular", 400],
    ["Medium", 500],
    ["Semibold", 600],
    ["Bold", 700],
    ["Heavy", 800],
    ["Black", 900]
];

const widths = [
    ["Compressed", 47],
    ["Condensed", 60],
    ["Regular", 100],
    ["Expanded", 132]
];

const tester = document.getElementById("tester");

widths.forEach(([name, width]) => {
    const section = document.createElement("section");
    section.className = "section";

    const title = document.createElement("h2");
    title.className = "section-title";
    title.textContent = `${name} · ${width}`;

    section.appendChild(title);

    weights.forEach(([label, weight]) => {
        const row = document.createElement("div");
        row.className = "sample";

        const weightLabel = document.createElement("span");
        weightLabel.className = "weight-label";
        weightLabel.textContent = `${label} · ${weight}`;

        const sample = document.createElement("span");
        sample.className =
            `sample-text variable w${weight} width-${width}`;

        sample.style.setProperty("--wght", weight);
        sample.textContent = "The quick brown fox jumps over the lazy dog.";

        row.appendChild(weightLabel);
        row.appendChild(sample);
        section.appendChild(row);
    });

    tester.appendChild(section);
});
</script>

</body>
</html>
